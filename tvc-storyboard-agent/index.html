<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>《李聪传》AI 短剧生产工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 扩展 Tailwind 主题：温暖的怀旧色调 + 衬线字体
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // 怀旧暖色系：从奶白到老纸沉淀色
              sepia: {
                50: '#faf6ef',
                100: '#f4ecd8',
                200: '#e8d8b0',
                300: '#d9be84',
                400: '#c89e58',
                500: '#b07f3a',
                600: '#92642d',
                700: '#754f25',
                800: '#5a3d20',
                900: '#3d2916',
                950: '#1f1209',
              },
              ink: {
                50: '#f4f1ec',
                100: '#e7e2da',
                200: '#cdc4b6',
                300: '#a89c89',
                400: '#776a59',
                500: '#544a3d',
                600: '#3d352b',
                700: '#2a241d',
                800: '#1a1612',
                900: '#0d0b09',
              },
            },
            fontFamily: {
              serif: [
                '"Noto Serif SC"',
                '"Source Han Serif SC"',
                '"Songti SC"',
                '"Source Han Serif CN"',
                '"PingFang SC"',
                'Georgia',
                'serif',
              ],
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                '"PingFang SC"',
                '"Microsoft YaHei"',
                '"Segoe UI"',
                'system-ui',
                'sans-serif',
              ],
            },
            boxShadow: {
              'soft': '0 1px 3px 0 rgba(0,0,0,0.4), 0 1px 2px 0 rgba(0,0,0,0.3)',
              'lift': '0 8px 24px -4px rgba(0,0,0,0.6), 0 4px 8px -2px rgba(0,0,0,0.4)',
              'glow-amber': '0 0 0 1px rgba(217,190,132,0.2), 0 4px 12px -2px rgba(217,190,132,0.15)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body, html, #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #0d0b09;
        background-image:
          radial-gradient(ellipse at top, rgba(217,190,132,0.04) 0%, transparent 50%),
          radial-gradient(ellipse at bottom right, rgba(146,100,45,0.03) 0%, transparent 50%);
        background-attachment: fixed;
        touch-action: pan-x pan-y;
        -webkit-user-select: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        color: #e7e2da;
      }
      /* Custom Scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .scrollbar-thin::-webkit-scrollbar {
          width: 6px;
          height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
          background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
          background: rgba(168, 156, 137, 0.15);
          border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
          background: rgba(217, 190, 132, 0.3);
      }
      /* 文本选中变成沉淀色 */
      ::selection {
        background-color: rgba(217, 190, 132, 0.3);
        color: #f4ecd8;
      }
      /* 焦点环统一暖色 */
      *:focus-visible {
        outline: 2px solid rgba(217, 190, 132, 0.6);
        outline-offset: 2px;
      }
      /* ----- 字体阶梯 ----- */
      /* H1：IP 标题（最重，最大），用于 Header / 项目名 */
      .ip-title {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 900;
        letter-spacing: 0.06em;
        font-feature-settings: 'palt' 1;
      }
      /* H2：季 / 章 标题（次重） */
      .season-title {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      /* H3：模块标题（中等粗细） */
      .section-title {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      /* 印记小标（label）— 全大写跟踪间距 */
      .label-stamp {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      /* 数字专用 — 衬线 + tabular nums */
      .num-display {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* 正文阅读字号阶（章节正文专用） */
      .body-prose {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
        font-weight: 400;
        line-height: 1.95;
      }
      /* 装饰横线（章节/标题下方） */
      .ornamental-rule {
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(217, 190, 132, 0.4) 30%,
          rgba(217, 190, 132, 0.6) 50%,
          rgba(217, 190, 132, 0.4) 70%,
          transparent 100%
        );
      }
      /* 卡片 hover 升起 */
      .card-lift {
        transition: all 200ms ease-out;
      }
      .card-lift:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px -4px rgba(0,0,0,0.6), 0 4px 8px -2px rgba(0,0,0,0.4);
      }
      /* Cursor blink animation for streaming text */
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .animate-cursor-blink {
        animation: cursor-blink 0.8s ease-in-out infinite;
      }
      /* Fade in animation */
      @keyframes fade-in {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fade-in 300ms ease-out forwards;
      }
      /* 渐入：从下方滑入 */
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up {
        animation: fade-up 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      /* Stagger delay 工具类，配合 .animate-fade-up 使用 */
      .stagger-1 { animation-delay: 40ms; }
      .stagger-2 { animation-delay: 80ms; }
      .stagger-3 { animation-delay: 120ms; }
      .stagger-4 { animation-delay: 160ms; }
      .stagger-5 { animation-delay: 200ms; }
      .stagger-6 { animation-delay: 240ms; }
      .stagger-7 { animation-delay: 280ms; }
      .stagger-8 { animation-delay: 320ms; }
      .stagger-9 { animation-delay: 360ms; }
      /* tab 切换柔和切入 */
      @keyframes tab-fade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-tab-fade {
        animation: tab-fade 240ms ease-out;
      }
      /* 角花淡入（hover 才显） */
      @keyframes orn-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-orn-in {
        animation: orn-fade-in 600ms ease-out 200ms both;
      }
      /* 印章盖印动效：旋转 + 缩放 + 透明度（仿书法落款） */
      @keyframes seal-stamp {
        0%   { transform: rotate(-12deg) scale(1.6); opacity: 0; }
        25%  { transform: rotate(-6deg) scale(1.05); opacity: 0.95; }
        50%  { transform: rotate(-8deg) scale(1.0); opacity: 1; }
        75%  { transform: rotate(-8deg) scale(1.0); opacity: 0.92; }
        100% { transform: rotate(-8deg) scale(0.95); opacity: 0; }
      }
      .animate-seal-stamp {
        animation: seal-stamp 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        transform-origin: center;
      }
      /* 古籍纸张纤维纹理（极淡） */
      .classical-page {
        background-image:
          radial-gradient(ellipse at 20% 10%, rgba(217,190,132,0.05) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 90%, rgba(146,100,45,0.06) 0%, transparent 50%),
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 2px,
            rgba(217,190,132,0.015) 2px,
            rgba(217,190,132,0.015) 3px
          );
      }
      /* 古籍首字下沉装饰（drop cap） */
      .classical-page .drop-cap::first-letter {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
        font-size: 2.6em;
        font-weight: 700;
        float: left;
        line-height: 0.95;
        margin: 0.05em 0.12em 0 0;
        color: rgba(217, 190, 132, 0.85);
        text-shadow: 0 1px 0 rgba(146, 100, 45, 0.3);
      }
      /* Sepia glow on hover for primary CTAs */
      @keyframes warm-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 190, 132, 0); }
        50% { box-shadow: 0 0 0 4px rgba(217, 190, 132, 0.15); }
      }
      .animate-warm-pulse {
        animation: warm-pulse 2s ease-in-out infinite;
      }

      /* 尊重系统"减少动效"设置 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Prevent browser zoom on Ctrl+wheel
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    </script>
  </body>
</html>
